[book]
title = "NixOS 모듈형 설정 프레임워크"
description = "TOML 선언과 Mods 프레임워크 기반의 NixOS 설정 프레임워크 문서"
authors = ["신동한"]
language = "ko"
src = ".docs"

[build]
build-dir = "book"

[output.html]
additional-css = ["theme/custom.css"]
git-repository-url = "https://github.com/donghans/nixos"
edit-url-template = "https://github.com/donghans/nixos/edit/stable/.docs/{path}"

[output.html.fold]
enable = true
level = 0

[preprocessor.mermaid]
command = "mdbook-mermaid"
