type       = "laptop"
convertible = true   # 360도 힌지 2-in-1: 가상 키보드/화면 회전/터치 제스처 등을 켬
preset     = "workstation"
bootDevice = "/dev/disk/by-label/ESP"
cpuCount   = 16

[mods.sys.services]
kernel-lockdown = true   # unstable 커널 + 인증서 이미지 + 부팅 중 lockdown(integrity) — mods/sys/services/kernel-lockdown.nix, plan boot-security S3a
tailpass = true
netdata  = true

[mods.gui.apps]
slack           = false  # 노트북에서는 쓰지 않음(데스크톱을 못 볼 때는 모바일 앱) — 장부 #95~#97: 실행 중 slack 이 배터리 약 0.3~0.4 W
incus-remote-view = true   # 데스크톱(beelink-ser7-co)의 incus VM 화면을 SSH 터널로 본다(incus-remote-view [VM이름])
embedctl        = true   # MS-1592 전용 EC 상태 도구(충전 상한·성능 모드·Cooler Boost) — mods/_tools/desktop/embedctl/README.md
