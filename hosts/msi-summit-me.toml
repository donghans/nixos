type       = "laptop"
convertible = true   # 360도 힌지 2-in-1: 가상 키보드/화면 회전/터치 제스처 등을 켬
preset     = "workstation"
bootDevice = "/dev/disk/by-label/ESP"
cpuCount   = 16

[mods.sys.services]
tailpass = true
netdata  = true

[mods.gui.apps]
qa-desktop-view = true   # 데스크톱(beelink-ser7-co)의 incus VM qa-desktop 화면을 SSH 터널로 본다
