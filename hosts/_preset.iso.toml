# ISO Preset — GUI 설치 환경 (Hyprland + kitty + Firefox)
# Firefox는 installation-cd-graphical-base.nix가 자동 포함
# stateVersion 미지정 (ISO는 영구 상태 없음 — rolling fallback 적용)

[mods.sys]
base       = true

[mods.sys.utils]
nfd     = false
trash   = false
archive = false
sshpass = false
steam-run = false
lazygit = false

[mods.sys.services]
bluetooth          = true
tailscale          = false
docker             = false
incus                  = false
incus-win11            = false
incus-guest            = true
caddy              = false
nix-cache-proxy    = false
aws-roles-anywhere = false
print-co           = false
tailpass           = false
netdata            = false
llm-ctx         = false
observe            = false
qa-desktop        = false   # 화면 확인용 QA VM(incus) — 워크스테이션 전용

[mods.gui]
enable = true

[mods.gui.apps]
vivaldi       = false
slack         = false
bitwarden     = false
speedcrunch   = true
gimp          = false
obs-studio    = false
drawing       = false
incus-vm      = false
hop           = false
qa-desktop-view = false   # 랩탑(msi-summit-me)만 호스트 toml 에서 true — 데스크톱의 incus VM qa-desktop 화면 보기

[mods.gui.utils]
notify-logger   = true
xarchiver       = false
thunar          = false
wayvnc          = false
office          = false
media           = false

[mods.devel]
enable = false

[explicitOptional]
# gui.enable 활성화 시 gui/default.nix가 크로스-도메인으로 자동 설정
paths = [
  "mods.sys.fonts.enable",
  "mods.sys.vfs.enable"
]
