# ISO Preset — GUI 설치 환경 (Hyprland + kitty + Firefox)
# Firefox는 installation-cd-graphical-base.nix가 자동 포함
# stateVersion 미지정 (ISO는 영구 상태 없음 — rolling fallback 적용)

[mods.sys]
base       = true

[mods.sys.utils]
nfd     = false
trash   = false
archive = false
sshpass = false
steam-run = false
lazygit = false

[mods.sys.services]
bluetooth          = true
tailscale          = false
docker             = false
incus                  = false
incus-win11            = false
incus-guest            = true
caddy              = false
nix-cache-proxy    = false
aws-roles-anywhere = false
print-co           = false
tailpass           = false
netdata            = false
llm-ctx         = false
observe            = false
qa-desktop        = false   # 화면 확인용 QA VM(incus) — 워크스테이션 전용
kernel-lockdown       = false   # unstable 커널 + lockdown(integrity) — 호스트가 켠다(msi-summit-me)
refind                = false   # rEFInd 메뉴를 nix 로 설치·관리(노트북에서 켠다)
secure-boot           = false   # Secure Boot(lanzaboote) 골격 — S5 에서 msi-summit-me 가 켠다(plan boot-security S3c)
luks                  = false   # LUKS2 루트(systemd initrd) 골격 — S4 에서 msi-summit-me 가 켠다(plan boot-security S3c)

[mods.gui]
enable = true

[mods.gui.apps]
vivaldi       = false
slack         = false
bitwarden     = false
speedcrunch   = true
gimp          = false
obs-studio    = false
drawing       = false
incus-vm      = false
hop           = false
incus-remote-view = false   # 랩탑(msi-summit-me)만 호스트 toml 에서 true — 데스크톱의 incus VM 화면 보기
# embedctl: MS-1592(MSI Summit E16Flip) 전용 EC 도구(충전 상한·성능 모드·Cooler Boost). Mods Coverage 통과용 false — **ISO 는 대상이 아니다**(2026-11-12 사용자 결정).
# embedctl 은 이제 debugfs/WMI 없이 msi-ec 커널 모듈의 sysfs 만 쓴다(lockdown 아래에서도 동작하도록). msi-ec 는 kernel-lockdown mod 만 제공하므로 설치 이미지에서는
# EC 쓰기가 아예 동작하지 않는다(예전의 「설치 이미지에서 팬을 올린 채 재설치」 구상은 폐기). 켜려면 먼저 plan embedctl-lockdown 결정 7·8 과 mods/gui/apps/embedctl.nix 의 assertion 을 볼 것.
# 코드 mods/_tools/desktop/embedctl/, 노트북은 hosts/msi-summit-me.toml 에서 true
embedctl      = false

[mods.gui.utils]
notify-logger   = true
xarchiver       = false
thunar          = false
wayvnc          = false
office          = false
media           = false

[mods.devel]
enable = false

[explicitOptional]
# gui.enable 활성화 시 gui/default.nix가 크로스-도메인으로 자동 설정
paths = [
  "mods.sys.fonts.enable",
  "mods.sys.vfs.enable"
]
