# stateVersion 미지정 → isRolling = true (nixup이 rolling lock 사용)
# stateVersion = "25.11" 처럼 명시 → isRolling = false (호스트별 lock 사용)

[mods.sys]
base = true

[mods.sys.utils]
nfd     = true
trash   = true
archive = true
sshpass = true
steam-run = true
lazygit = true

[mods.sys.services]
bluetooth      = true
tailscale      = true
docker         = true
incus                  = true
incus-win11            = true
incus-guest            = false
caddy            = false
nix-cache-proxy    = false
aws-roles-anywhere = false
print-co           = true
tailpass           = false
netdata            = true
llm-ctx         = false
observe            = true
qa-desktop         = false   # incus VM `qa-desktop` 이 있는 호스트에서만 true (Claude 전역 지침에 VM 사용 규칙 추가)

[mods.gui]
enable = true

[mods.gui.utils]
notify-logger   = true
xarchiver       = true
thunar          = true
wayvnc          = true
office          = true
media           = true

[mods.devel]
enable = true

[explicitOptional]
# gui/default.nix가 gui.enable 시 크로스-도메인으로 자동 활성화
paths = [
  "mods.sys.fonts.enable",
  "mods.sys.vfs.enable"
]
