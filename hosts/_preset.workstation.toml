# stateVersion 미지정 → isRolling = true (nixup이 rolling lock 사용)
# stateVersion = "25.11" 처럼 명시 → isRolling = false (호스트별 lock 사용)

[mods.sys]
base = true

[mods.sys.utils]
nfd     = true
trash   = true
archive = true
sshpass = true
steam-run = true
lazygit = true

[mods.sys.services]
bluetooth      = true
tailscale      = true
docker         = true
incus                  = true
incus-win11            = true
incus-guest            = false
caddy            = false
nix-cache-proxy    = false
aws-roles-anywhere = false
print-co           = true
tailpass           = false
netdata            = true
llm-ctx         = false
observe            = true
qa-desktop         = false   # incus VM `qa-desktop` 이 있는 호스트에서만 true (Claude 전역 지침에 VM 사용 규칙 추가)
incus-devbr0       = false   # 격리 개발 VM 용 incus 브리지 devbr0 + 호스트 방화벽(plan dev-sandbox-pilot) — 호스트가 켠다(msi-summit-me)
nix-serve-devbr0  = false   # devbr0 전용 Nix 빌드 캐시(호스트 스토어를 VM 에 내어줌) — 호스트가 켠다(msi-summit-me)
kernel-lockdown       = false   # unstable 커널 + lockdown(integrity) — 호스트가 켠다(msi-summit-me)
refind                = false   # rEFInd 메뉴를 nix 로 설치·관리(노트북에서 켠다)
secure-boot           = false   # Secure Boot(lanzaboote) 골격 — S5 에서 msi-summit-me 가 켠다(plan boot-security S3c)
luks                  = false   # LUKS2 루트(systemd initrd) 골격 — S4 에서 msi-summit-me 가 켠다(plan boot-security S3c)
tpm-login             = false   # TPM+PIN 부팅 직후 greetd 로그인·키링 자동 해제(봉인된 비밀번호) — 기본 꺼짐(plan boot-doctor-keyring §11-B)
fwupd                 = false   # LVFS 펌웨어·Secure Boot dbx 갱신 도구(노트북에서 켠다 — plan s5-secure-boot-exec §6)

[mods.gui]
enable = true

[mods.gui.utils]
notify-logger   = true
xarchiver       = true
thunar          = true
wayvnc          = true
office          = true
media           = true

[mods.devel]
enable = true

[explicitOptional]
# gui/default.nix가 gui.enable 시 크로스-도메인으로 자동 활성화
paths = [
  "mods.sys.fonts.enable",
  "mods.sys.vfs.enable"
]
