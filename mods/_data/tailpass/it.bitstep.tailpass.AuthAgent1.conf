<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  authagent 자신은 tailpass-auth 계정만 own 가능하게 제한한다. 메서드 호출
  (send_destination)은 모든 유저에게 허용한다 — 신원 검증은 D-Bus 정책이 아니라
  서비스 자신의 polkit CheckAuthorization 호출로 수행한다(로드맵
  client-security-hardening.md E절: "데몬 자신이 직접 CheckAuthorization으로
  D-Bus 호출자의 실제 신원을 검증한 뒤에만 값을 반환한다").
-->
<busconfig>
  <policy user="tailpass-auth">
    <allow own="it.bitstep.tailpass.AuthAgent1"/>
  </policy>
  <policy context="default">
    <allow send_destination="it.bitstep.tailpass.AuthAgent1"/>
    <allow receive_sender="it.bitstep.tailpass.AuthAgent1"/>
  </policy>
</busconfig>
