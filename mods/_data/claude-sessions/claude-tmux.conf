# claude 전용 tmux 설정 — 전용 소켓(`tmux -L claude`)에서만 읽히므로 일반 tmux 사용에는 영향이 없다.
# 쓰는 곳: claude-tmux(래퍼)·claude-sessions(UI) 가 `-L claude -f 이 파일` 로 부른다.

# Claude Code 가 쓰는 Ctrl+B(백그라운드)·Ctrl+A(줄 처음)와 겹치지 않도록 접두 키를 Ctrl+] 로 바꾼다. 분리(detach)는 F12 한 번 또는 Ctrl+] d.
set -g prefix C-]
unbind C-b
bind C-] send-prefix
bind -n F12 detach-client
bind d detach-client

# 상태 줄을 끈다: 시계 등이 주기적으로 화면을 갱신하면 PSR(화면 절전)을 방해할 수 있고, 화면 한 줄도 아깝다.
set -g status off

# 색·키·클립보드·알림 통과
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:extkeys:clipboard,*:RGB"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on
set -g escape-time 10

# ssh 와 kitty 가 번갈아·동시에 붙을 때 마지막(가장 최근 입력한) 클라이언트 크기를 따른다
set -g window-size latest
set -g aggressive-resize on

set -g history-limit 100000
set -g mouse off

# 새 세션이 붙는 클라이언트의 이 환경 변수를 물려받는다(서버는 처음 띄운 쪽 환경을 갖고 있어 ssh 쪽과 다를 수 있다)
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE"
