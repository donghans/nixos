# sbox broker 송신 허용 프리셋 (plan dev-sandbox-pilot §29-30, S71). 「어떤 도구·OS·에이전트가 어떤 도메인을 쓰나」를 기재한 표.
# 프로젝트(ct)의 허용목록 = always + 자동(flavor·도구) + 매니페스트 [network] presets + [network] egress − [network] exclude.
#   매니페스트 [network]:  presets = ["rust"]  egress = ["api.stripe.com", "db.internal:5432"]  exclude = ["claude.ai:443", "go"]
#   exclude 는 「호스트:포트」 한 항목, 또는 프리셋 이름(그 프리셋 전체) — 이름이 겹치면 프리셋 이름으로 본다.
# 매니페스트를 지정하지 않은 ct 는 만들 수 없다. 프로젝트 없이 만들려면 `sboxctl create --no-project`(사용자 확인 필요)이고, 그러면 모든 프리셋을 허용한다(열린 허용 — 위험).
# 항목은 「정확한 호스트:포트」(와일드카드는 맨 앞 `*.` 만, 포트 생략 시 443). CONNECT 전용이라 http(80)는 안 된다. 추가·삭제할 때는 이유를 주석으로 남긴다.

always = ["git-github", "llm-claude", "docker"]   # 모든 ct 에 — Docker 는 기본 설치(--no-docker 제외, 그때는 매니페스트 exclude = ["docker"])

[auto.flavor]    # sboxctl create --flavor
debian = ["os-debian"]
ubuntu = ["os-ubuntu"]

[auto.tool]      # 매니페스트 [inferred]·[override]·[resolved] 에 이 도구가 있으면
node = ["node"]
rust = ["rust"]
go = ["go"]
python = ["python"]
uv = ["python"]

[preset.os-debian]
desc = "Debian apt 미러"
allow = ["deb.debian.org:443", "security.debian.org:443", "deb.debian.org:80", "security.debian.org:80"]   # :80 — Debian 이미지(Docker 빌드 안 apt)는 http 로 받는다. 서명 검증되는 저장소만

[preset.os-ubuntu]
desc = "Ubuntu apt 미러"
allow = ["archive.ubuntu.com:443", "security.ubuntu.com:443", "archive.ubuntu.com:80", "security.ubuntu.com:80"]   # :80 — Ubuntu 이미지 apt 용

[preset.docker]
desc = "rootless Docker 설치(download.docker.com)와 이미지 pull. 이미지 블롭 CDN 두 곳 — cloudfront 가 빠지면 pull 이 마지막에 403(2026-11-23). 새 레지스트리·CDN 은 프로젝트 egress 에"
allow = ["download.docker.com:443", "registry-1.docker.io:443", "auth.docker.io:443", "production.cloudflare.docker.com:443", "production.cloudfront.docker.com:443"]

[preset.node]
desc = "Node.js 배포·npm"
allow = ["registry.npmjs.org:443", "nodejs.org:443"]

[preset.rust]
desc = "rustup·crates.io"
allow = ["static.rust-lang.org:443", "index.crates.io:443", "static.crates.io:443", "crates.io:443"]

[preset.go]
desc = "Go 모듈 프록시·체크섬"
allow = ["proxy.golang.org:443", "sum.golang.org:443", "go.dev:443"]

[preset.python]
desc = "PyPI"
allow = ["pypi.org:443", "files.pythonhosted.org:443"]

[preset.alpine]
desc = "Alpine 패키지(apk) — node:*-alpine 같은 Alpine 기반 이미지의 빌드 안에서 쓴다"
allow = ["dl-cdn.alpinelinux.org:443"]

[preset.ghcr]
desc = "GitHub Container Registry(ghcr.io) 이미지 — Dockerfile 의 FROM·COPY --from 이 ghcr.io 를 쓰는 프로젝트(예: astral-sh/uv). 블롭은 pkg-containers 도메인에서 받는다"
allow = ["ghcr.io:443", "pkg-containers.githubusercontent.com:443"]

[preset.nodesource]
desc = "NodeSource apt 저장소·설치 스크립트(deb.nodesource.com) — Dockerfile 이 setup_XX.x 로 Node 를 설치하는 경우"
allow = ["deb.nodesource.com:443"]

[preset.mongodb-apt]
desc = "MongoDB apt 저장소(repo.mongodb.org)와 서명 키(www.mongodb.org) — Dockerfile 이 MongoDB 를 직접 설치하는 경우"
allow = ["repo.mongodb.org:443", "www.mongodb.org:443", "pgp.mongodb.com:443"]

[preset.git-github]
desc = "GitHub 소스(git over https)"
allow = ["github.com:443", "codeload.github.com:443", "objects.githubusercontent.com:443", "raw.githubusercontent.com:443"]

[preset.llm-claude]
desc = "Claude Code 인증·API"
allow = ["api.anthropic.com:443", "console.anthropic.com:443", "claude.ai:443"]
