# sbox broker 의 기본 송신 허용 세트 (plan dev-sandbox-pilot §29-25). 모든 ct 에 공통으로 적용되는 「정확한 호스트:포트」 — 와일드카드는 최소로.
# 프로젝트별 추가분은 매니페스트의 [network] egress = ["host:port", ...] (포트 생략 시 443). 추가·삭제할 때는 이유를 주석으로 남긴다.
# 일반 HTTP(80)는 프록시가 지원하지 않으므로(CONNECT 전용) https 가 있는 미러만 적는다.
default_allow = [
  # Debian·Ubuntu 패키지 (apt)
  "deb.debian.org:443", "security.debian.org:443", "archive.ubuntu.com:443", "security.ubuntu.com:443",
  # Docker (rootless Docker 설치·이미지)
  # (이미지 블롭 CDN 두 곳 — cloudfront 가 빠지면 pull 이 마지막에 403, 2026-11-23 겪음. 새 레지스트리·CDN 은 여기나 매니페스트 [network] egress 에 추가)
  "download.docker.com:443", "registry-1.docker.io:443", "auth.docker.io:443",
  "production.cloudflare.docker.com:443", "production.cloudfront.docker.com:443",
  # Node
  "registry.npmjs.org:443", "nodejs.org:443",
  # Rust
  "static.rust-lang.org:443", "index.crates.io:443", "static.crates.io:443", "crates.io:443",
  # Go·Python
  "proxy.golang.org:443", "sum.golang.org:443", "go.dev:443", "pypi.org:443", "files.pythonhosted.org:443",
  # 소스(git over https)
  "github.com:443", "codeload.github.com:443", "objects.githubusercontent.com:443", "raw.githubusercontent.com:443",
  # LLM 에이전트(Claude Code) — 인증·API
  "api.anthropic.com:443", "console.anthropic.com:443", "claude.ai:443",
]
