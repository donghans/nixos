name: Deploy docs

on:
  push:
    branches: [stable]
    paths:
      - '_docs/**'
      - '!_docs/site/node_modules/**'
      - '!_docs/site/dist/**'

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync docs into Starlight
        run: |
          rsync -a --delete \
            --exclude='_snippets/' \
            _docs/content/ _docs/site/src/content/docs/
          find _docs/site/src/content/docs -name '*.md' | while read f; do
            title=$(grep -m1 "^# " "$f" | sed 's/^# //')
            python3 _docs/process_doc.py "$f" "$title"
          done

      - name: Install deps
        run: npm install
        working-directory: _docs/site

      - name: Build
        run: npm run build
        working-directory: _docs/site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _docs/site/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
